<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
      .head { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }
      .brand { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; }
      .body { font-family: 'Inter', Helvetica, sans-serif; font-weight: 400; }
</style>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(11,12,13,0.045)" stroke-width="1"/>
</pattern>
</defs>

<!-- base -->
<rect width="1200" height="630" fill="#fcfcfa"/>
<rect width="1200" height="630" fill="url(#grid)"/>

<!-- corner reticle -->
<g stroke="#0b0c0d" stroke-opacity="0.75" stroke-width="2.25" fill="none">
<path d="M 40 78 L 40 40 L 78 40"/>
<path d="M 1122 40 L 1160 40 L 1160 78"/>
<path d="M 40 552 L 40 590 L 78 590"/>
<path d="M 1160 552 L 1160 590 L 1122 590"/>
</g>

<!-- brand mark -->
<circle cx="70" cy="112" r="5" fill="#e01280"/>
<text x="84" y="119" class="brand" font-size="21" letter-spacing="0.03em" fill="#0b0c0d">Vex</text>

<!-- title -->
<text x="68" y="232" class="head" font-size="72" letter-spacing="-0.01em" fill="#0b0c0d">Unlimited Seats</text>

<!-- description (5 lines) -->
<g class="body" font-size="22" fill="#2b2b2b">
<text x="70" y="296">One flat platform fee per customer account — that's</text>
<text x="70" y="332">the whole model. Add or remove user seats and assets</text>
<text x="70" y="368">inside it freely, with no per-seat billing to track.</text>
<text x="70" y="404">Built for MSPs and MSSPs plugging an autonomous</text>
<text x="70" y="440">security system into every client account they run.</text>
</g>

<!-- icon: account container with seats inside, overflowing seats outside (unlimited), infinity badge -->
<g transform="translate(945,270)">
<circle r="86" fill="none" stroke="#6c6c70" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.6"/>
<circle r="86" fill="none" stroke="#e01280" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.4"
transform="rotate(35)"/>

<!-- account container -->
<rect x="-40" y="-52" width="80" height="66" rx="12" fill="#fcfcfa" stroke="#e01280" stroke-width="3"/>
<!-- header divider -->
<line x1="-40" y1="-30" x2="40" y2="-30" stroke="#e01280" stroke-width="2" opacity="0.5"/>
<!-- account label mark -->
<circle cx="-28" cy="-41" r="4" fill="#e01280"/>
<rect x="-18" y="-44" width="24" height="6" rx="3" fill="#e01280" opacity="0.5"/>

<!-- seats grid inside container -->
<g fill="#fcfcfa" stroke="#e01280" stroke-width="2.5">
<circle cx="-22" cy="-8" r="6"/>
<circle cx="0" cy="-8" r="6"/>
<circle cx="22" cy="-8" r="6"/>
<circle cx="-11" cy="8" r="6"/>
<circle cx="11" cy="8" r="6"/>
</g>

<!-- overflowing seats outside container: unlimited, add/remove freely -->
<circle cx="50" cy="-16" r="7" fill="#fcfcfa" stroke="#6c6c70" stroke-width="2" stroke-dasharray="2 3"/>
<circle cx="-54" cy="8" r="7" fill="#fcfcfa" stroke="#6c6c70" stroke-width="2" stroke-dasharray="2 3"/>
<circle cx="-46" cy="-24" r="5" fill="#fcfcfa" stroke="#6c6c70" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7"/>

<!-- infinity badge -->
<g transform="translate(55,56)">
<circle r="25" fill="#fcfcfa" stroke="#e01280" stroke-width="1.5"/>
<path d="M -10,0 C -10,-6 -3,-6 0,0 C 3,6 10,6 10,0 C 10,-6 3,-6 0,0 C -3,6 -10,6 -10,0 Z"
fill="none" stroke="#e01280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
</svg>