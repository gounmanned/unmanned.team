<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
      .head { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }
      .brand { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; }
      .body { font-family: 'Inter', Helvetica, sans-serif; font-weight: 400; }
      .label { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; }
      .badge { font-family: 'Inter', Helvetica, sans-serif; font-weight: 600; }
    </style>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(11,12,13,0.045)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="#fcfcfa"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- corner reticle -->
  <g stroke="#0b0c0d" stroke-opacity="0.75" stroke-width="2.25" fill="none">
    <path d="M 40 78 L 40 40 L 78 40"/>
    <path d="M 1122 40 L 1160 40 L 1160 78"/>
    <path d="M 40 552 L 40 590 L 78 590"/>
    <path d="M 1160 552 L 1160 590 L 1122 590"/>
  </g>

  <!-- brand mark -->
  <circle cx="70" cy="112" r="5" fill="#e01280"/>
  <text x="84" y="119" class="brand" font-size="21" letter-spacing="0.03em" fill="#0b0c0d">Vex</text>

  <!-- new badge -->
  <rect x="70" y="140" width="146" height="30" rx="15" fill="#e01280"/>
  <text x="143" y="160" class="badge" font-size="13" letter-spacing="0.02em" fill="#fcfcfa" text-anchor="middle">2 new integrations</text>

  <!-- title -->
  <text x="68" y="240" class="head" font-size="60" letter-spacing="-0.01em" fill="#0b0c0d">Push to Teams</text>
  <text x="68" y="304" class="head" font-size="60" letter-spacing="-0.01em" fill="#0b0c0d">and Rapid7 IDR</text>

  <!-- description -->
  <g class="body" font-size="22" fill="#2b2b2b">
    <text x="70" y="364">Every signal Vex finds can now be pushed straight</text>
    <text x="70" y="400">into Microsoft Teams or Rapid7 IDR.</text>
    <text x="70" y="436">Connect Vex once, then triage choke points and</text>
    <text x="70" y="472">priority fixes from any channel or SIEM.</text>
  </g>

  <!-- icon composition: Vex node pushing signal to two destinations -->
  <g transform="translate(940,210)">
    <!-- connector lines -->
    <path d="M -14,10 C 40,10 60,-60 120,-98" fill="none" stroke="#6c6c70" stroke-width="1.5"/>
    <path d="M -14,10 C 40,10 60,80 120,118" fill="none" stroke="#6c6c70" stroke-width="1.5"/>

    <!-- traveling signal dots -->
    <circle cx="30" cy="4" r="4" fill="#e01280"/>
    <circle cx="30" cy="52" r="4" fill="#e01280"/>

    <!-- central Vex signal node -->
    <g>
      <circle r="30" fill="none" stroke="#6c6c70" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.5"/>
      <circle r="18" fill="#fcfcfa" stroke="#e01280" stroke-width="2.5"/>
      <path d="M -7,-6 L 0,8 L 7,-6" fill="none" stroke="#e01280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="52" class="label" font-size="14" fill="#0b0c0d" text-anchor="middle">Vex</text>

    <!-- destination 1: Microsoft Teams -->
    <g transform="translate(190,-98)">
      <rect x="-90" y="-34" width="220" height="68" rx="10" fill="#fcfcfa" stroke="#0b0c0d" stroke-opacity="0.75" stroke-width="1.5"/>
      <g transform="translate(-58,0)">
        <rect x="-16" y="-16" width="32" height="32" rx="8" fill="none" stroke="#0b0c0d" stroke-width="2"/>
        <circle cx="-5" cy="-4" r="4" fill="#0b0c0d"/>
        <path d="M -13,9 C -13,1 -9,-2 -3,-2 C 3,-2 7,1 7,9" fill="none" stroke="#0b0c0d" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="18" y="-3" class="label" font-size="15" fill="#0b0c0d">Microsoft Teams</text>
      <text x="18" y="17" class="body" font-size="13" fill="#6c6c70">Alerts to a channel</text>
      <rect x="60" y="-32" width="40" height="20" rx="10" fill="#e01280"/>
      <text x="80" y="-18" class="badge" font-size="10" letter-spacing="0.03em" fill="#fcfcfa" text-anchor="middle">NEW</text>
    </g>

    <!-- destination 2: Rapid7 IDR -->
    <g transform="translate(190,118)">
      <rect x="-90" y="-34" width="220" height="68" rx="10" fill="#fcfcfa" stroke="#0b0c0d" stroke-opacity="0.75" stroke-width="1.5"/>
      <g transform="translate(-58,0)">
        <path d="M 0,-17 L 15,-10 L 15,6 C 15,15 8,20 0,23 C -8,20 -15,15 -15,6 L -15,-10 Z" fill="none" stroke="#0b0c0d" stroke-width="2" stroke-linejoin="round"/>
        <path d="M -6,3 L -1,9 L 8,-4" fill="none" stroke="#0b0c0d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="18" y="-3" class="label" font-size="15" fill="#0b0c0d">Rapid7 IDR</text>
      <text x="18" y="17" class="body" font-size="13" fill="#6c6c70">Findings to your SIEM</text>
      <rect x="60" y="-32" width="40" height="20" rx="10" fill="#e01280"/>
      <text x="80" y="-18" class="badge" font-size="10" letter-spacing="0.03em" fill="#fcfcfa" text-anchor="middle">NEW</text>
    </g>
  </g>
</svg>