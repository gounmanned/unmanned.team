<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
<style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
      .head { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }
      .brand { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 600; }
      .body { font-family: 'Inter', Helvetica, sans-serif; font-weight: 400; }
</style>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
<path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(11,12,13,0.045)" stroke-width="1"/>
</pattern>
</defs>

<!-- base -->
<rect width="1200" height="630" fill="#fcfcfa"/>
<rect width="1200" height="630" fill="url(#grid)"/>

<!-- corner reticle -->
<g stroke="#0b0c0d" stroke-opacity="0.75" stroke-width="2.25" fill="none">
<path d="M 40 78 L 40 40 L 78 40"/>
<path d="M 1122 40 L 1160 40 L 1160 78"/>
<path d="M 40 552 L 40 590 L 78 590"/>
<path d="M 1160 552 L 1160 590 L 1122 590"/>
</g>

<!-- brand mark -->
<circle cx="70" cy="112" r="5" fill="#e01280"/>
<text x="84" y="119" class="brand" font-size="21" letter-spacing="0.03em" fill="#0b0c0d">Vex</text>

<!-- title -->
<text x="68" y="232" class="head" font-size="72" letter-spacing="-0.01em" fill="#0b0c0d">Autonomous Response</text>

<!-- description (5 lines) -->
<g class="body" font-size="22" fill="#2b2b2b">
<text x="70" y="296">The moment an attack is seen, Vex doesn't wait for a</text>
<text x="70" y="332">human in the loop — it acts. Accounts get locked,</text>
<text x="70" y="368">domains isolated, exposed assets patched, and</text>
<text x="70" y="404">emerging threats blocked before they can spread —</text>
<text x="70" y="440">autonomously, in milliseconds.</text>
</g>

<!-- icon: asset node locking down under lightning-fast response, with a ms-timer badge -->
<g transform="translate(945,270)">
<circle r="86" fill="none" stroke="#6c6c70" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.6"/>
<circle r="86" fill="none" stroke="#e01280" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.4"
transform="rotate(35)"/>

<!-- background asset nodes: other endpoints/domains in the environment, unaffected -->
<g stroke="#6c6c70" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.55">
<line x1="-55" y1="-30" x2="-4" y2="0"/>
<line x1="-58" y1="34" x2="-4" y2="0"/>
<line x1="50" y1="-52" x2="4" y2="-24"/>
</g>
<g fill="#fcfcfa" stroke="#6c6c70" stroke-width="2">
<circle cx="-55" cy="-30" r="5"/>
<circle cx="-58" cy="34" r="5"/>
<circle cx="50" cy="-52" r="5"/>
</g>

<!-- instant action burst radiating from the protected asset -->
<g stroke="#e01280" stroke-width="2.25" stroke-linecap="round" opacity="0.85">
<line x1="-4" y1="0" x2="-30" y2="-4"/>
<line x1="-4" y1="0" x2="-22" y2="20"/>
<line x1="-4" y1="0" x2="6" y2="-26"/>
<line x1="-4" y1="0" x2="24" y2="14"/>
</g>

<!-- central asset node, secured -->
<g transform="translate(-4,0)">
<circle r="18" fill="none" stroke="#e01280" stroke-width="2.5"/>
<!-- lock body -->
<rect x="-9" y="-2" width="18" height="15" rx="2.5" fill="#fcfcfa" stroke="#e01280" stroke-width="2.5"/>
<path d="M -5,-2 L -5,-8 A 5,5 0 0 1 5,-8 L 5,-2" fill="none" stroke="#e01280" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- lightning bolt striking in from top-left, signaling instant response -->
<path d="M -46,-58 L -30,-58 L -38,-40 L -26,-40 L -50,-8 L -42,-34 L -54,-34 Z" fill="#e01280"/>

<!-- millisecond timer badge -->
<g transform="translate(55,56)">
<circle r="25" fill="#fcfcfa" stroke="#e01280" stroke-width="1.5"/>
<circle r="14" fill="none" stroke="#e01280" stroke-width="2"/>
<line x1="0" y1="0" x2="0" y2="-9" stroke="#e01280" stroke-width="2" stroke-linecap="round"/>
<line x1="0" y1="0" x2="7" y2="3" stroke="#e01280" stroke-width="2" stroke-linecap="round"/>
<line x1="-2.5" y1="-16.5" x2="2.5" y2="-16.5" stroke="#e01280" stroke-width="2" stroke-linecap="round"/>
</g>
</g>
</svg>